[project]
name = "alphaplan-mcp"
version = "0.1.0"
description = "Redis-backed generic result-set MCP server"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=3,<4",
    "pyodbc>=5.3.0",
    "py-key-value-aio[redis]>=0.1.0",
    "redis>=5.0.0",
    "pyarrow>=15.0.0",
    "polars>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
alphaplan-mcp = "alphaplan_mcp.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["alphaplan_mcp"]
